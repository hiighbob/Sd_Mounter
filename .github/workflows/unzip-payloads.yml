name: unzip-payloads

on:
  push:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: co

      - id: extract
        name: Extract zips
        if: hashFiles('.extract-done') == ''
        continue-on-error: true
        run: |
          set -x
          unzip -o sd-mounter-v1.5.zip -d .
          mkdir -p skill-magisk-module-builder
          python3 - <<'EOF' 2>&1 | tee .skill-extract-err.txt
          import zipfile, sys
          try:
              with zipfile.ZipFile('magisk-module-builder.skill') as z:
                  z.extractall('skill-magisk-module-builder')
                  print("SKILL_EXTRACT_OK", z.namelist())
          except Exception as e:
              print("SKILL_EXTRACT_FAIL", repr(e)); sys.exit(1)
          EOF
          touch .extract-done

      - name: Status + commit (always)
        if: always()
        run: |
          set +e
          echo "EVENT=$GITHUB_EVENT_NAME SHA=$GITHUB_SHA" > .workflow-status.txt
          echo "checkout=${{ steps.co.conclusion }} extract=${{ steps.extract.outcome }}/${{ steps.extract.conclusion }}" >> .workflow-status.txt
          if [ -f .extract-done ]; then echo "marker=present" >> .workflow-status.txt; else echo "marker=absent" >> .workflow-status.txt; fi
          ls -A >> .workflow-status.txt 2>&1
          git config user.name "unzip-bot"
          git config user.email "unzip-bot@users.noreply.github.com"
          git add -A
          git commit -m "status/extract update" || echo "commit-empty: $?" >> .workflow-status.txt
          git pull --rebase origin main >> .workflow-status.txt 2>&1 || true
          git push >> .workflow-status.txt 2>&1 || true
